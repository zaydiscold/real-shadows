name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the library targets es2020 and runs anywhere; this floor is the
        # dev toolchain's (vitest 4 needs node 20+)
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        # the accuracy suite proves the README's error table against
        # astronomy-engine on every run
      - run: npm test
      - run: npm run build
