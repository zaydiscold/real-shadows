name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the shipped code is es2020 and uses no node apis, so running the
          # same pure math on three node versions proved nothing. one lts run.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        # the accuracy suite proves the README's error table against
        # astronomy-engine on every run
      - run: npm test
      - run: npm run build
        # publint checks the published shape (exports, types, file paths);
        # attw checks that every module resolution mode gets real types
      - run: npx publint@0.3
      - run: npx @arethetypeswrong/cli@0.18 --pack .
