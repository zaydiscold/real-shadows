name: release

# publishes to npm when a version tag is pushed:
#   npm version patch|minor|major   (bumps package.json, commits, tags)
#   git push --follow-tags
#
# auth is OIDC trusted publishing, so there is no NPM_TOKEN secret to leak or
# rotate: github mints a short-lived identity token, npm verifies it came from
# this repo and this workflow file, and provenance is attested automatically.
#
# one-time setup on npmjs.com, only possible once a version exists (which is
# why 1.0.0 went out by hand):
#   npmjs.com/package/real-shadows/access -> trusted publisher
#   organization zaydiscold / repository real-shadows / workflow release.yml

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required: lets the runner mint the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm 11.5.1+; node 22 still ships npm 10
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx publint@0.3
      - run: npx @arethetypeswrong/cli@0.18 --pack .

      # no NODE_AUTH_TOKEN: the OIDC identity is the credential
      - run: npm publish --access public
